# Optional: paste these mappings into your own kitty.conf (or home-manager's
# programs.kitty.extraConfig).
#
# Ctrl+Shift+S splits the window you are in and runs the sidebar in the new
# 25% split, whatever that window holds (a tmux client, a shell, pi). `q` in the
# sidebar quits it and the wrapper closes the split.
map ctrl+shift+s launch --location=vsplit --bias=25 --allow-remote-control sh -c "radar sidebar; kitten @ close-window --self"
#
# Focus between the two splits, and restoring the sidebar from the tmux side.
map ctrl+shift+left neighboring_window left
map ctrl+shift+right neighboring_window right
map ctrl+shift+b combine : remote_control action --match var:radar_sidebar=1 "layout_action bias 25" : remote_control focus-window --match var:radar_sidebar=1
