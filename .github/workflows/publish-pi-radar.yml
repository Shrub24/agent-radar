name: Publish pi-radar

# Publishing is a tag push: `pi-radar-vX.Y.Z` must match pi-radar/package.json
# and point at a commit on main. Authentication is npm trusted publishing
# (OIDC) — this workflow holds no npm token. The package's trusted publisher on
# npmjs.com must name this repository (Shrub24/agent-radar) and this filename
# (publish-pi-radar.yml), with no environment.
on:
  push:
    tags:
      - 'pi-radar-v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: pi-radar
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          git merge-base --is-ancestor "$RELEASE_COMMIT" origin/main
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";

          const match = /^pi-radar-v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.exec(process.env.RELEASE_TAG);
          if (!match) throw new Error(`Expected stable pi-radar-vX.Y.Z tag; got ${process.env.RELEASE_TAG}`);
          const expected = match.slice(1).join(".");
          const actual = JSON.parse(readFileSync("package.json", "utf8")).version;
          if (actual !== expected) throw new Error(`Tag version ${expected} does not match package.json version ${actual}`);
          NODE

      - name: Refuse an already-published version
        run: |
          version="${GITHUB_REF_NAME#pi-radar-v}"
          if npm view "pi-radar@${version}" version >/dev/null 2>&1; then
            echo "::error::pi-radar ${version} is already on npm; bump the package and tag the new version"
            exit 1
          fi

      - name: Ensure npm supports trusted publishing
        run: |
          current=$(npm --version)
          if ! node -e '
            const have = process.argv[1].split(".").map(Number);
            const need = [11, 5, 1];
            for (let i = 0; i < 3; i += 1) {
              if (have[i] > need[i]) process.exit(0);
              if (have[i] < need[i]) process.exit(1);
            }
            process.exit(0);
          ' "$current"; then
            echo "npm $current predates trusted publishing; installing npm 11"
            npm install --global npm@11
          fi
          printf 'node %s, npm %s\n' "$(node --version)" "$(npm --version)"

      - run: npm ci
      - run: npm test

      - name: Preflight the tarball
        run: npm pack --dry-run

      - run: npm publish --access public --provenance
