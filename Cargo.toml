[package]
name = "agent-radar"
version = "0.7.0"
edition = "2024"
# Floor imposed by the dependencies (ratatui 0.30 and ratatui-crossterm 0.1
# declare rust-version 1.88.0); edition 2024 itself requires 1.85.
rust-version = "1.88"
description = "Full-screen fleet overview for local coding agents, with focus and confirmed close/restart actions"

[[bin]]
name = "radar"
path = "src/main.rs"

[dependencies]
# The command line is declared once, so `--help`, usage errors and completions
# cannot drift from what the binary actually parses.
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
crossterm = "0.29"
nucleo-picker = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter"] }
unicode-width = "0.2"
# `unstable-rendered-line-info` exposes `Paragraph::line_count`, the row count of
# a wrapped paragraph: the details panel scrolls in the rows it draws, so it asks
# the widget that wraps for the geometry rather than counting them itself.
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
rustix = { version = "1", features = ["process", "fs", "termios", "event", "param", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "=1.2.3"
signal-hook = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "io-util"] }
toml = "1.1.6"
# Domain errors state their own message and source rather than a hand-written
# `Display`; the wire keeps its typed codes, so no error becomes opaque here.
thiserror = "2"
# The frame vocabulary for a working mark: one-character animation presets.
tui-spinner = "0.4"
